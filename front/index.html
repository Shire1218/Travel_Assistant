<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Assistant - 旅行助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5E9',
                        secondary: '#6366F1',
                        accent: '#F59E0B',
                        ocean: '#06B6D4',
                        sunset: '#F97316',
                        forest: '#10B981',
                        sand: '#FEF3C7',
                        coral: '#F43F5E',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="header-gradient text-white px-6 py-3 shadow-lg">
            <div class="flex items-center justify-between max-w-screen-2xl mx-auto">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-white/20 rounded-lg flex items-center justify-center backdrop-blur-sm">
                        <i class="fas fa-globe-asia text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold">Travel Assistant</h1>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center cursor-pointer hover:bg-white/30 transition-colors">
                        <i class="fas fa-bell text-sm"></i>
                    </div>
                    <div class="w-8 h-8 bg-gradient-to-br from-amber-400 to-orange-500 rounded-full flex items-center justify-center text-xs font-bold cursor-pointer" id="userAvatar">T</div>
                    <button type="button" onclick="handleLogout()" class="px-3 py-1.5 text-xs font-medium bg-white/20 hover:bg-white/30 rounded-lg transition-colors" title="退出登录">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div class="main-content" id="mainContent">
            <!-- 主页面：旅行计划列表 -->
            <div id="mainPage" class="page-view">
                <main class="center-panel">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">我的旅行计划</h2>
                            <p class="text-sm text-gray-500 mt-1">管理你的每一次旅行梦想</p>
                        </div>
                        <button type="button" onclick="openModal('travel')" class="btn-primary flex items-center gap-2">
                            <i class="fas fa-plus"></i>
                            <span>添加计划</span>
                        </button>
                    </div>

                    <!-- 统计卡片 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 animate-fade-in-up" style="animation-delay: 0.1s">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-500">总计划</p>
                                    <p class="text-2xl font-bold text-gray-800 mt-1" id="totalPlans">0</p>
                                </div>
                                <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center">
                                    <i class="fas fa-route text-primary text-lg"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 animate-fade-in-up" style="animation-delay: 0.2s">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-500">进行中</p>
                                    <p class="text-2xl font-bold text-forest mt-1" id="ongoingPlans">0</p>
                                </div>
                                <div class="w-12 h-12 bg-green-50 rounded-xl flex items-center justify-center">
                                    <i class="fas fa-play-circle text-forest text-lg"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 animate-fade-in-up" style="animation-delay: 0.3s">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-500">已完成</p>
                                    <p class="text-2xl font-bold text-secondary mt-1" id="completedPlans">0</p>
                                </div>
                                <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center">
                                    <i class="fas fa-check-circle text-secondary text-lg"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 旅行计划卡片列表 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="travelPlanList"></div>

                    <!-- 空状态 -->
                    <div class="empty-state hidden" id="emptyState">
                        <i class="fas fa-suitcase-rolling"></i>
                        <h3 class="text-lg font-semibold mt-3">还没有旅行计划</h3>
                        <p class="text-sm mt-2">点击"添加计划"开始你的第一段旅程吧！</p>
                    </div>
                </main>
            </div>

            <!-- 编辑页面：左侧编辑区 + 右侧侧边栏 -->
            <div id="editorPage" class="page-view hidden">
                <div class="main-content" id="editorMainContent">
                    <!-- 左侧：旅行计划编辑区 -->
                    <div class="editor-panel" id="editorPanel">
                        <div class="editor-header">
                            <div class="flex items-center gap-3">
                                <button type="button" onclick="goBack()" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors">
                                    <i class="fas fa-arrow-left text-gray-600 text-sm"></i>
                                </button>
                                <div>
                                    <h2 class="text-lg font-bold text-gray-800" id="editorTitle">旅行计划编辑</h2>
                                    <p class="text-xs text-gray-500" id="editorSubtitle">编辑你的旅行详情</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-gray-400" id="saveStatus"><i class="fas fa-check-circle mr-1"></i>已保存</span>
                                <button type="button" onclick="openModal('travel')" class="btn-primary text-sm py-1.5 px-3"><i class="fas fa-save mr-1"></i>保存</button>
                            </div>
                        </div>

                        <!-- 编辑区 Tab 导航 -->
                        <div class="editor-tabs" id="editorTabs">
                            <button type="button" class="editor-tab active" data-tab="route" onclick="switchEditorTab('route')"><i class="fas fa-route mr-1.5"></i>路线与日程</button>
                            <button type="button" class="editor-tab" data-tab="spots" onclick="switchEditorTab('spots')"><i class="fas fa-map-marker-alt mr-1.5"></i>景点介绍</button>
                            <button type="button" class="editor-tab" data-tab="details" onclick="switchEditorTab('details')"><i class="fas fa-info-circle mr-1.5"></i>详细信息</button>
                        </div>

                        <!-- 编辑区内容 -->
                        <div class="editor-content">
                            <!-- 路线与日程 Tab（整合） -->
                            <div class="editor-panel-content active" id="tabRoute">
                                <div class="route-schedule-integrated">
                                    <!-- 左侧：路线规划 -->
                                    <div class="route-schedule-left">
                                        <div class="route-planner">
                                            <div class="route-header">
                                                <h3 class="font-bold text-gray-800"><i class="fas fa-route mr-2 text-primary"></i>路线规划</h3>
                                                <button type="button" onclick="addSpot()" class="btn-primary text-sm py-1.5 px-3"><i class="fas fa-plus mr-1"></i>添加景点</button>
                                            </div>
                                            <div class="route-input-area">
                                                <div class="flex gap-2">
                                                    <input type="text" id="spotSearchInput" placeholder="搜索或输入景点名称..." class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-sm" onkeydown="if(event.key==='Enter'){event.preventDefault(); addSpot();}">
                                                    <button type="button" onclick="addSpot()" class="btn-primary text-sm">添加</button>
                                                </div>
                                            </div>
                                            <div class="route-list" id="routeList"></div>
                                            <div class="route-preview" id="routePreview"></div>
                                        </div>
                                    </div>

                                    <!-- 右侧：时间安排 -->
                                    <div class="route-schedule-right">
                                        <div class="schedule-planner">
                                            <div class="schedule-header">
                                                <h3 class="font-bold text-gray-800"><i class="fas fa-calendar-alt mr-2 text-secondary"></i>时间安排</h3>
                                                <button type="button" onclick="openModal('schedule')" class="btn-primary text-sm py-1.5 px-3"><i class="fas fa-plus mr-1"></i>添加活动</button>
                                            </div>
                                            <div class="schedule-date-nav">
                                                <button type="button" onclick="changeScheduleDate(-1)" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200"><i class="fas fa-chevron-left text-gray-500 text-xs"></i></button>
                                                <span class="text-sm font-semibold text-gray-700" id="scheduleDateLabel">2025年8月15日</span>
                                                <button type="button" onclick="changeScheduleDate(1)" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200"><i class="fas fa-chevron-right text-gray-500 text-xs"></i></button>
                                            </div>
                                            <div class="schedule-list" id="scheduleList"></div>
                                            <div class="conflict-warning hidden" id="conflictWarning"><i class="fas fa-exclamation-triangle mr-2"></i><span>检测到时间段冲突，请调整时间安排</span></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 景点介绍 Tab（卡片式） -->
                            <div class="editor-panel-content" id="tabSpots">
                                <div class="spots-editor">
                                    <div class="spots-header">
                                        <h3 class="font-bold text-gray-800">景点介绍</h3>
                                        <button type="button" onclick="addSpotDetail()" class="btn-primary text-sm py-1.5 px-3"><i class="fas fa-plus mr-1"></i>添加景点</button>
                                    </div>
                                    <div class="spots-card-grid" id="spotsCardGrid">
                                        <!-- 景点卡片由JS动态生成 -->
                                    </div>
                                </div>
                            </div>

                            <!-- 详细信息 Tab -->
                            <div class="editor-panel-content" id="tabDetails">
                                <div class="details-editor">
                                    <div class="detail-section">
                                        <div class="detail-section-header">
                                            <h3 class="font-bold text-gray-800"><i class="fas fa-car mr-2 text-primary"></i>交通方式</h3>
                                            <button type="button" onclick="openModal('transport')" class="text-sm text-primary hover:underline"><i class="fas fa-plus mr-1"></i>添加</button>
                                        </div>
                                        <div class="detail-section-content"><div class="transport-list" id="transportList"></div></div>
                                    </div>
                                    <div class="detail-section">
                                        <div class="detail-section-header">
                                            <h3 class="font-bold text-gray-800"><i class="fas fa-hotel mr-2 text-secondary"></i>住宿信息</h3>
                                            <button type="button" onclick="openModal('accommodation')" class="text-sm text-primary hover:underline"><i class="fas fa-plus mr-1"></i>添加</button>
                                        </div>
                                        <div class="detail-section-content"><div class="accommodation-list" id="accommodationList"></div></div>
                                    </div>
                                    <div class="detail-section">
                                        <div class="detail-section-header">
                                            <h3 class="font-bold text-gray-800"><i class="fas fa-wallet mr-2 text-sunset"></i>预算管理</h3>
                                            <button type="button" onclick="openModal('expense')" class="text-sm text-primary hover:underline"><i class="fas fa-plus mr-1"></i>添加费用</button>
                                        </div>
                                        <div class="detail-section-content">
                                            <div class="budget-summary" id="budgetSummary"></div>
                                            <div class="expense-list" id="expenseList"></div>
                                        </div>
                                    </div>
                                    <div class="detail-section">
                                        <div class="detail-section-header">
                                            <h3 class="font-bold text-gray-800"><i class="fas fa-sticky-note mr-2 text-forest"></i>笔记与待办</h3>
                                            <button type="button" onclick="openModal('todo')" class="text-sm text-primary hover:underline"><i class="fas fa-plus mr-1"></i>添加</button>
                                        </div>
                                        <div class="detail-section-content">
                                            <div class="todo-list" id="todoList"></div>
                                            <div class="notes-area mt-4">
                                                <label class="form-label">旅行笔记</label>
                                                <textarea id="travelNotes" class="form-textarea" rows="4" placeholder="记录旅行中的想法和注意事项..." onchange="autoSave()"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 可拖动分隔线 -->
                    <div class="resizer" id="resizer"><div class="resizer-handle"><i class="fas fa-grip-vertical"></i></div></div>

                    <!-- 右侧：侧边栏 -->
                    <div class="sidebar-panel" id="sidebarPanel">
                        <div class="sidebar-tabs">
                            <button type="button" class="sidebar-tab active" data-tab="checkins" onclick="switchSidebarTab('checkins')"><i class="fas fa-map-pin"></i><span>打卡</span><span class="tab-badge" id="sidebarCheckinCount">0</span></button>
                            <button type="button" class="sidebar-tab" data-tab="foods" onclick="switchSidebarTab('foods')"><i class="fas fa-utensils"></i><span>美食</span><span class="tab-badge" id="sidebarFoodCount">0</span></button>
                            <button type="button" class="sidebar-tab" data-tab="map" onclick="switchSidebarTab('map')"><i class="fas fa-map"></i><span>地图</span></button>
                        </div>
                        <div class="sidebar-content">
                            <div class="sidebar-panel-content active" id="sidebarCheckins">
                                <div class="sidebar-filter">
                                    <span class="filter-chip active" onclick="filterCheckins('all', this)">全部</span>
                                    <span class="filter-chip" onclick="filterCheckins('image', this)">有图</span>
                                </div>
                                <button type="button" onclick="openModal('checkin')" class="sidebar-add-btn"><i class="fas fa-plus mr-1"></i>添加打卡</button>
                                <div class="checkin-timeline" id="sidebarCheckinTimeline"></div>
                            </div>
                            <div class="sidebar-panel-content" id="sidebarFoods">
                                <div class="sidebar-filter">
                                    <span class="filter-chip active" onclick="filterFoods('all', this)">全部</span>
                                    <span class="filter-chip" onclick="filterFoods('local', this)">本地特色</span>
                                    <span class="filter-chip" onclick="filterFoods('snack', this)">小吃</span>
                                    <span class="filter-chip" onclick="filterFoods('restaurant', this)">餐厅</span>
                                </div>
                                <button type="button" onclick="openModal('food')" class="sidebar-add-btn" style="background: linear-gradient(135deg, #F97316, #F59E0B);"><i class="fas fa-plus mr-1"></i>添加美食</button>
                                <div class="sidebar-food-list" id="sidebarFoodList"></div>
                            </div>
                            <div class="sidebar-panel-content" id="sidebarMap">
                                <div class="map-container-sidebar" id="sidebarMapContainer"></div>
                                <div class="mt-3 text-center text-xs text-gray-400"><i class="fas fa-info-circle mr-1"></i>地图数据为模拟展示</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑旅行计划弹窗 -->
    <div class="modal-overlay" id="travelModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-800" id="travelModalTitle">添加旅行计划</h3>
                <button type="button" onclick="closeModal('travel')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button>
            </div>
            <form id="travelForm" onsubmit="saveTravelPlan(event)">
                <input type="hidden" id="travelEditId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">目的地</label>
                        <div class="relative"><i class="fas fa-map-marker-alt absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text" id="travelDestination" required class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="例如：云南大理"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">旅行标题</label><input type="text" id="travelTitle" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="例如：大理洱海之旅"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">开始日期</label><input type="date" id="travelStartDate" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">结束日期</label><input type="date" id="travelEndDate" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">预算 (元)</label><input type="number" id="travelBudget" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="5000"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">状态</label><select id="travelStatus" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"><option value="planned">计划中</option><option value="ongoing">进行中</option><option value="completed">已完成</option></select></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">描述</label><textarea id="travelDescription" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm resize-none" placeholder="写下你的旅行计划..."></textarea></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">封面图片URL</label><input type="url" id="travelImage" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="https://example.com/image.jpg"></div>
                </div>
                <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal('travel')" class="btn-secondary flex-1">取消</button><button type="submit" class="btn-primary flex-1">保存</button></div>
            </form>
        </div>
    </div>

    <!-- 添加打卡记录弹窗 -->
    <div class="modal-overlay" id="checkinModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6"><h3 class="text-xl font-bold text-gray-800">添加打卡记录</h3><button type="button" onclick="closeModal('checkin')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button></div>
            <form id="checkinForm" onsubmit="saveCheckin(event)">
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">打卡地点</label><input type="text" id="checkinLocation" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="例如：洱海"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">打卡日期</label><input type="date" id="checkinDate" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">文字描述</label><textarea id="checkinDescription" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm resize-none" placeholder="记录你的旅行感受..."></textarea></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">图片URL</label><input type="url" id="checkinImage" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="https://example.com/photo.jpg"></div>
                </div>
                <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal('checkin')" class="btn-secondary flex-1">取消</button><button type="submit" class="btn-primary flex-1">保存</button></div>
            </form>
        </div>
    </div>

    <!-- 添加美食收录弹窗 -->
    <div class="modal-overlay" id="foodModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6"><h3 class="text-xl font-bold text-gray-800">添加美食收录</h3><button type="button" onclick="closeModal('food')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button></div>
            <form id="foodForm" onsubmit="saveFood(event)">
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">店铺名称</label><input type="text" id="foodName" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm" placeholder="例如：过桥米线总店"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">地址</label><input type="text" id="foodAddress" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm" placeholder="例如：大理古城人民路"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">评分 (1-5)</label><select id="foodRating" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm"><option value="5">⭐⭐⭐⭐⭐ 5分</option><option value="4">⭐⭐⭐⭐ 4分</option><option value="3">⭐⭐⭐ 3分</option><option value="2">⭐⭐ 2分</option><option value="1">⭐ 1分</option></select></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">分类</label><select id="foodCategory" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm"><option value="local">本地特色</option><option value="snack">小吃</option><option value="restaurant">餐厅</option></select></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">人均消费 (元)</label><input type="number" id="foodPrice" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm" placeholder="80"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">推荐菜品</label><input type="text" id="foodDishes" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm" placeholder="例如：过桥米线、烤乳扇"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">店铺图片URL</label><input type="url" id="foodImage" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm" placeholder="https://example.com/food.jpg"></div>
                </div>
                <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal('food')" class="btn-secondary flex-1">取消</button><button type="submit" class="btn-primary flex-1" style="background: linear-gradient(135deg, #F97316, #F59E0B);">保存</button></div>
            </form>
        </div>
    </div>

    <!-- 景点编辑弹窗 -->
    <div class="modal-overlay" id="spotEditModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6"><h3 class="text-xl font-bold text-gray-800" id="spotEditModalTitle">编辑景点</h3><button type="button" onclick="closeModal('spotEdit')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button></div>
            <form id="spotEditForm" onsubmit="saveSpotDetail(event)">
                <input type="hidden" id="spotEditId">
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">景点名称</label><input type="text" id="spotEditName" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">详细描述</label><textarea id="spotEditDescription" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm resize-none"></textarea></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">图片URL</label><input type="url" id="spotEditImage" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="https://example.com/spot.jpg"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">开放时间</label><input type="text" id="spotEditHours" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="例如：08:00-18:00"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">门票价格</label><input type="text" id="spotEditTicket" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="例如：¥60"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">联系方式</label><input type="text" id="spotEditContact" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" placeholder="电话号码"></div>
                </div>
                <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal('spotEdit')" class="btn-secondary flex-1">取消</button><button type="submit" class="btn-primary flex-1">保存</button></div>
            </form>
        </div>
    </div>

    <!-- 添加日程活动弹窗 -->
    <div class="modal-overlay" id="scheduleModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6"><h3 class="text-xl font-bold text-gray-800">添加日程活动</h3><button type="button" onclick="closeModal('schedule')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button></div>
            <form id="scheduleForm" onsubmit="saveSchedule(event)">
                <input type="hidden" id="scheduleEditId">
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">活动标题</label><input type="text" id="scheduleTitle" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm" placeholder="例如：游览古城"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">日期</label><input type="date" id="scheduleDate" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">类型</label><select id="scheduleType" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm"><option value="sightseeing">游览</option><option value="transport">交通</option><option value="food">美食</option><option value="activity">活动</option><option value="other">其他</option></select></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">开始时间</label><input type="time" id="scheduleStartTime" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">结束时间</label><input type="time" id="scheduleEndTime" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">描述</label><textarea id="scheduleDescription" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm resize-none" placeholder="活动详细描述..."></textarea></div>
                </div>
                <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal('schedule')" class="btn-secondary flex-1">取消</button><button type="submit" class="btn-primary flex-1" style="background:linear-gradient(135deg,#6366F1,#818CF8)">保存</button></div>
            </form>
        </div>
    </div>

    <!-- 添加交通弹窗 -->
    <div class="modal-overlay" id="transportModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6"><h3 class="text-xl font-bold text-gray-800">添加交通记录</h3><button type="button" onclick="closeModal('transport')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button></div>
            <form id="transportForm" onsubmit="saveTransport(event)">
                <input type="hidden" id="transportEditId">
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">交通方式</label><select id="transportType" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-sm"><option value="高铁">高铁</option><option value="飞机">飞机</option><option value="租车">租车</option><option value="公交">公交</option><option value="其他">其他</option></select></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">出发地</label><input type="text" id="transportFrom" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-sm" placeholder="例如：昆明"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">目的地</label><input type="text" id="transportTo" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-sm" placeholder="例如：大理"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">时间</label><input type="text" id="transportTime" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-sm" placeholder="例如：2025-08-15 08:30"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">费用 (元)</label><input type="number" id="transportCost" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-sm" placeholder="145"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">备注</label><input type="text" id="transportNote" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-sm" placeholder="可选"></div>
                    </div>
                </div>
                <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal('transport')" class="btn-secondary flex-1">取消</button><button type="submit" class="btn-primary flex-1">保存</button></div>
            </form>
        </div>
    </div>

    <!-- 添加住宿弹窗 -->
    <div class="modal-overlay" id="accommodationModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6"><h3 class="text-xl font-bold text-gray-800">添加住宿记录</h3><button type="button" onclick="closeModal('accommodation')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button></div>
            <form id="accommodationForm" onsubmit="saveAccommodation(event)">
                <input type="hidden" id="accommodationEditId">
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">住宿名称</label><input type="text" id="accommodationName" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm" placeholder="例如：大理洱海海景酒店"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">地址</label><input type="text" id="accommodationAddress" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm" placeholder="例如：大理市洱海边"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">入住日期</label><input type="date" id="accommodationCheckIn" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">退房日期</label><input type="date" id="accommodationCheckOut" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">价格 (元/晚)</label><input type="number" id="accommodationPrice" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm" placeholder="380"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">备注</label><input type="text" id="accommodationNote" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary outline-none text-sm" placeholder="可选"></div>
                    </div>
                </div>
                <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal('accommodation')" class="btn-secondary flex-1">取消</button><button type="submit" class="btn-primary flex-1" style="background:linear-gradient(135deg,#6366F1,#818CF8)">保存</button></div>
            </form>
        </div>
    </div>

    <!-- 添加费用弹窗 -->
    <div class="modal-overlay" id="expenseModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6"><h3 class="text-xl font-bold text-gray-800">添加费用记录</h3><button type="button" onclick="closeModal('expense')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button></div>
            <form id="expenseForm" onsubmit="saveExpense(event)">
                <input type="hidden" id="expenseEditId">
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">费用分类</label><select id="expenseCategory" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none text-sm"><option value="交通">交通</option><option value="住宿">住宿</option><option value="餐饮">餐饮</option><option value="门票">门票</option><option value="其他">其他</option></select></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">金额 (元)</label><input type="number" id="expenseAmount" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none text-sm" placeholder="100"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">日期</label><input type="date" id="expenseDate" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none text-sm"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">备注</label><input type="text" id="expenseNote" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none text-sm" placeholder="可选"></div>
                </div>
                <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal('expense')" class="btn-secondary flex-1">取消</button><button type="submit" class="btn-primary flex-1" style="background:linear-gradient(135deg,#F97316,#F59E0B)">保存</button></div>
            </form>
        </div>
    </div>

    <!-- 添加待办弹窗 -->
    <div class="modal-overlay" id="todoModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6"><h3 class="text-xl font-bold text-gray-800">添加待办事项</h3><button type="button" onclick="closeModal('todo')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button></div>
            <form id="todoForm" onsubmit="saveTodo(event)">
                <input type="hidden" id="todoEditId">
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1.5">待办内容</label><textarea id="todoText" required rows="4" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-forest/20 focus:border-forest outline-none text-sm resize-none" placeholder="例如：预订返程车票"></textarea></div>
                </div>
                <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal('todo')" class="btn-secondary flex-1">取消</button><button type="submit" class="btn-primary flex-1" style="background:linear-gradient(135deg,#10B981,#34D399)">保存</button></div>
            </form>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6"><h3 class="text-xl font-bold text-gray-800" id="detailModalTitle">详情</h3><button type="button" onclick="closeModal('detail')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors"><i class="fas fa-times text-gray-500"></i></button></div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script src="api/config.js"></script>
    <script src="api/auth.js"></script>
    <script src="api/user.js"></script>
    <script src="api/plans.js"></script>
    <script src="api/routes.js"></script>
    <script src="api/schedules.js"></script>
    <script src="api/spots.js"></script>
    <script src="api/checkins.js"></script>
    <script src="api/foods.js"></script>
    <script src="api/transports.js"></script>
    <script src="api/accommodations.js"></script>
    <script src="api/expenses.js"></script>
    <script src="api/todos.js"></script>
    <script src="app.js"></script>
</body>
</html>
