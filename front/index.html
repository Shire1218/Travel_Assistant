<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Assistant - 旅行助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5E9',
                        secondary: '#6366F1',
                        accent: '#F59E0B',
                        ocean: '#06B6D4',
                        sunset: '#F97316',
                        forest: '#10B981',
                        sand: '#FEF3C7',
                        coral: '#F43F5E',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="header-gradient text-white px-6 py-4 shadow-lg">
            <div class="flex items-center justify-between max-w-screen-2xl mx-auto">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
                        <i class="fas fa-globe-asia text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">Travel Assistant</h1>
                        <p class="text-xs text-white/70">你的智能旅行助手</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden md:flex items-center gap-2 bg-white/10 rounded-xl px-4 py-2 backdrop-blur-sm">
                        <i class="fas fa-search text-white/70"></i>
                        <input type="text" placeholder="搜索旅行计划..." class="bg-transparent border-none outline-none text-sm text-white placeholder-white/50 w-48">
                    </div>
                    <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center cursor-pointer hover:bg-white/30 transition-colors">
                        <i class="fas fa-bell text-sm"></i>
                    </div>
                    <div class="w-9 h-9 bg-gradient-to-br from-amber-400 to-orange-500 rounded-full flex items-center justify-center text-sm font-bold cursor-pointer">
                        T
                    </div>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 左侧：打卡记录面板 -->
            <aside class="left-panel">
                <div class="panel-header bg-gradient-to-r from-cyan-50 to-blue-50">
                    <i class="fas fa-map-pin text-primary"></i>
                    <span>打卡记录</span>
                    <button onclick="openModal('checkin')" class="ml-auto w-7 h-7 bg-primary text-white rounded-lg flex items-center justify-center hover:bg-primary/80 transition-colors text-sm">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>

                <!-- 筛选器 -->
                <div class="px-4 py-3 flex flex-wrap gap-2 border-b border-gray-100">
                    <span class="filter-chip active" onclick="filterCheckins('all', this)">
                        <i class="fas fa-layer-group text-xs"></i> 全部
                    </span>
                    <span class="filter-chip" onclick="filterCheckins('2025', this)">2025</span>
                    <span class="filter-chip" onclick="filterCheckins('2024', this)">2024</span>
                    <span class="filter-chip" onclick="filterCheckins('image', this)">
                        <i class="fas fa-image text-xs"></i> 有图
                    </span>
                </div>

                <!-- 打卡时间轴 -->
                <div class="p-4">
                    <div class="checkin-timeline" id="checkinTimeline">
                        <!-- 打卡记录由JS动态生成 -->
                    </div>
                </div>
            </aside>

            <!-- 中间：旅游计划主面板 -->
            <main class="center-panel">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">我的旅行计划</h2>
                        <p class="text-sm text-gray-500 mt-1">管理你的每一次旅行梦想</p>
                    </div>
                    <button onclick="openModal('travel')" class="btn-primary flex items-center gap-2">
                        <i class="fas fa-plus"></i>
                        <span>添加计划</span>
                    </button>
                </div>

                <!-- 统计卡片 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 animate-fade-in-up" style="animation-delay: 0.1s">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">总计划</p>
                                <p class="text-2xl font-bold text-gray-800 mt-1" id="totalPlans">0</p>
                            </div>
                            <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center">
                                <i class="fas fa-route text-primary text-lg"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 animate-fade-in-up" style="animation-delay: 0.2s">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">进行中</p>
                                <p class="text-2xl font-bold text-forest mt-1" id="ongoingPlans">0</p>
                            </div>
                            <div class="w-12 h-12 bg-green-50 rounded-xl flex items-center justify-center">
                                <i class="fas fa-play-circle text-forest text-lg"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 animate-fade-in-up" style="animation-delay: 0.3s">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">已完成</p>
                                <p class="text-2xl font-bold text-secondary mt-1" id="completedPlans">0</p>
                            </div>
                            <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center">
                                <i class="fas fa-check-circle text-secondary text-lg"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 旅行计划卡片列表 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="travelPlanList">
                    <!-- 旅行计划卡片由JS动态生成 -->
                </div>

                <!-- 空状态 -->
                <div class="empty-state hidden" id="emptyState">
                    <i class="fas fa-suitcase-rolling"></i>
                    <h3 class="text-lg font-semibold mt-3">还没有旅行计划</h3>
                    <p class="text-sm mt-2">点击"添加计划"开始你的第一段旅程吧！</p>
                </div>
            </main>

            <!-- 右侧：美食收录面板 -->
            <aside class="right-panel">
                <div class="panel-header bg-gradient-to-r from-orange-50 to-amber-50">
                    <i class="fas fa-utensils text-sunset"></i>
                    <span>美食收录</span>
                    <button onclick="openModal('food')" class="ml-auto w-7 h-7 bg-sunset text-white rounded-lg flex items-center justify-center hover:bg-sunset/80 transition-colors text-sm">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>

                <!-- 美食分类筛选 -->
                <div class="px-4 py-3 flex flex-wrap gap-2 border-b border-gray-100">
                    <span class="filter-chip active" onclick="filterFoods('all', this)">
                        <i class="fas fa-fire text-xs"></i> 全部
                    </span>
                    <span class="filter-chip" onclick="filterFoods('local', this)">本地特色</span>
                    <span class="filter-chip" onclick="filterFoods('snack', this)">小吃</span>
                    <span class="filter-chip" onclick="filterFoods('restaurant', this)">餐厅</span>
                </div>

                <!-- 地图区域 -->
                <div class="px-4 pt-3">
                    <div class="map-container" id="foodMap">
                        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
                            <div class="text-center text-gray-400">
                                <i class="fas fa-map-marked-alt text-3xl mb-2"></i>
                                <p class="text-xs">美食地图</p>
                            </div>
                        </div>
                        <!-- 地图标记由JS动态生成 -->
                    </div>
                </div>

                <!-- 美食列表 -->
                <div class="p-4" id="foodList">
                    <!-- 美食卡片由JS动态生成 -->
                </div>
            </aside>
        </div>
    </div>

    <!-- 添加/编辑旅行计划弹窗 -->
    <div class="modal-overlay" id="travelModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-800" id="travelModalTitle">添加旅行计划</h3>
                <button onclick="closeModal('travel')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors">
                    <i class="fas fa-times text-gray-500"></i>
                </button>
            </div>
            <form id="travelForm" onsubmit="saveTravelPlan(event)">
                <input type="hidden" id="travelEditId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">目的地</label>
                        <div class="relative">
                            <i class="fas fa-map-marker-alt absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="travelDestination" required
                                class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"
                                placeholder="例如：云南大理">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">旅行标题</label>
                        <input type="text" id="travelTitle" required
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"
                            placeholder="例如：大理洱海之旅">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">开始日期</label>
                            <input type="date" id="travelStartDate" required
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">结束日期</label>
                            <input type="date" id="travelEndDate" required
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">预算 (元)</label>
                        <input type="number" id="travelBudget"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"
                            placeholder="5000">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">状态</label>
                        <select id="travelStatus"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                            <option value="planned">计划中</option>
                            <option value="ongoing">进行中</option>
                            <option value="completed">已完成</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">描述</label>
                        <textarea id="travelDescription" rows="3"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm resize-none"
                            placeholder="写下你的旅行计划..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">封面图片URL</label>
                        <input type="url" id="travelImage"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"
                            placeholder="https://example.com/image.jpg">
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal('travel')" class="btn-secondary flex-1">取消</button>
                    <button type="submit" class="btn-primary flex-1">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加打卡记录弹窗 -->
    <div class="modal-overlay" id="checkinModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-800">添加打卡记录</h3>
                <button onclick="closeModal('checkin')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors">
                    <i class="fas fa-times text-gray-500"></i>
                </button>
            </div>
            <form id="checkinForm" onsubmit="saveCheckin(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">打卡地点</label>
                        <input type="text" id="checkinLocation" required
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm"
                            placeholder="例如：洱海">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">打卡日期</label>
                        <input type="date" id="checkinDate" required
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">文字描述</label>
                        <textarea id="checkinDescription" rows="3"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm resize-none"
                            placeholder="记录你的旅行感受..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">图片URL</label>
                        <div class="image-upload-area" onclick="document.getElementById('checkinImage').focus()">
                            <i class="fas fa-cloud-upload-alt text-2xl mb-2"></i>
                            <p class="text-sm">点击输入图片URL</p>
                        </div>
                        <input type="url" id="checkinImage"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm mt-2"
                            placeholder="https://example.com/photo.jpg">
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal('checkin')" class="btn-secondary flex-1">取消</button>
                    <button type="submit" class="btn-primary flex-1">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加美食收录弹窗 -->
    <div class="modal-overlay" id="foodModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-800">添加美食收录</h3>
                <button onclick="closeModal('food')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors">
                    <i class="fas fa-times text-gray-500"></i>
                </button>
            </div>
            <form id="foodForm" onsubmit="saveFood(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">店铺名称</label>
                        <input type="text" id="foodName" required
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm"
                            placeholder="例如：过桥米线总店">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">地址</label>
                        <input type="text" id="foodAddress" required
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm"
                            placeholder="例如：大理古城人民路">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">评分 (1-5)</label>
                            <select id="foodRating"
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm">
                                <option value="5">⭐⭐⭐⭐⭐ 5分</option>
                                <option value="4">⭐⭐⭐⭐ 4分</option>
                                <option value="3">⭐⭐⭐ 3分</option>
                                <option value="2">⭐⭐ 2分</option>
                                <option value="1">⭐ 1分</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">分类</label>
                            <select id="foodCategory"
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm">
                                <option value="local">本地特色</option>
                                <option value="snack">小吃</option>
                                <option value="restaurant">餐厅</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">人均消费 (元)</label>
                        <input type="number" id="foodPrice"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm"
                            placeholder="80">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">推荐菜品</label>
                        <input type="text" id="foodDishes"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm"
                            placeholder="例如：过桥米线、烤乳扇">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">店铺图片URL</label>
                        <input type="url" id="foodImage"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sunset/20 focus:border-sunset outline-none transition-all text-sm"
                            placeholder="https://example.com/food.jpg">
                    </div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal('food')" class="btn-secondary flex-1">取消</button>
                    <button type="submit" class="btn-primary flex-1" style="background: linear-gradient(135deg, #F97316, #F59E0B);">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-800" id="detailModalTitle">详情</h3>
                <button onclick="closeModal('detail')" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors">
                    <i class="fas fa-times text-gray-500"></i>
                </button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
